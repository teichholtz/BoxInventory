{% extends 'inventory/base.html' %}
{% block content %}<div class="panel"><h1>{{ title }}</h1><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p style="color:#b42318">{{ error }}</p>{% endfor %}{% endfor %}<div class="actions"><button class="btn" type="submit">Save</button>{% if cancel_pk %}<a class="btn secondary" href="{% url cancel_url cancel_pk %}">Cancel</a>{% else %}<a class="btn secondary" href="{% url cancel_url %}">Cancel</a>{% endif %}</div></form></div>{% endblock %}
